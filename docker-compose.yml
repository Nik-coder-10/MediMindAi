version: "3.8"

services:
  # 1. Next.js Web Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ayursetu-web-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://ayush_admin:ayush_secure_pass_2026@postgres:5432/ayush_db?schema=public
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=sih-2026-ayursetu-production-jwt-super-secret-key-32b
      - ENCRYPTION_SECRET_KEY=e4d2f8a19b3c4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin123
      - S3_BUCKET_NAME=medical-prescriptions
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ayursetu-network

  # 2. PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: ayursetu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ayush_admin
      POSTGRES_PASSWORD: ayush_secure_pass_2026
      POSTGRES_DB: ayush_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ayush_admin -d ayush_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ayursetu-network

  # 3. MinIO S3-Compatible Object Store
  minio:
    image: minio/minio:latest
    container_name: ayursetu-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - ayursetu-network

networks:
  ayursetu-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
