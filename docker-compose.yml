version: "3.8"

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ayush_postgres
    restart: always
    environment:
      POSTGRES_USER: ayush_user
      POSTGRES_PASSWORD: ayush_password
      POSTGRES_DB: ayush_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ayush_user -d ayush_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. MinIO S3-Compatible Object Store
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: ayush_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # 3. Next.js Web App
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ayush_web
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://ayush_user:ayush_password@postgres:5432/ayush_db?schema=public"
      NEXTAUTH_URL: "http://localhost:3000"
      AUTH_SECRET: "sih2026-ayush-platform-secret-key-32charsmin"
      S3_ENDPOINT: "http://minio:9000"
      S3_BUCKET_NAME: "ayush-medical-records"
      S3_ACCESS_KEY_ID: "minioadmin"
      S3_SECRET_ACCESS_KEY: "minioadmin"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  minio_data:
